<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EPUB Successor Demo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <strong>EPUB Successor</strong>
      <label
        >Fixture
        <select id="fixture"></select
      ></label>
      <button id="open-fixture" type="button">Open fixture</button>
      <label class="file"
        >Open file <input id="file" type="file" accept=".epub,application/epub+zip"
      /></label>
    </header>
    <main>
      <aside>
        <fieldset>
          <legend>Layout</legend>
          <label
            >Flow
            <select id="flow">
              <option value="scrolled">Scroll</option>
              <option value="paginated">Paginated</option>
            </select></label
          >
          <label
            >Spread
            <select id="spread">
              <option value="single">Single</option>
              <option value="double">Double</option>
            </select></label
          >
          <label
            >Theme
            <select id="theme">
              <option value="light">Light</option>
              <option value="sepia">Sepia</option>
              <option value="dark">Dark</option>
            </select></label
          >
          <label
            >Font size <input id="font-size" type="range" min="75" max="200" value="100"
          /></label>
          <label
            >Line height
            <input id="line-height" type="range" min="1" max="2.4" step="0.1" value="1.5"
          /></label>
          <label>Margins <input id="margins" type="range" min="0" max="80" value="24" /></label>
        </fieldset>
        <nav>
          <h2>Contents</h2>
          <ol id="toc"></ol>
        </nav>
      </aside>
      <section class="workspace">
        <div class="toolbar">
          <button id="previous" type="button">Previous</button>
          <button id="next" type="button">Next</button>
          <button id="highlight" type="button" disabled>Highlight selection</button>
          <output id="status">Opening…</output>
        </div>
        <div id="reader" aria-label="EPUB reader"></div>
        <output id="relocation" aria-live="polite"></output>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
